# GDD Provider Configuration
# This file stores non-secret GDD configuration.
# Secrets (OAuth tokens, etc.) are handled by the provider, not stored here.

provider: local  # Options: google-drive, local, generic

document:
  id: ""
  name: ""
  # drive_file_id: ""  # Uncomment for Google Drive

sync:
  enabled: true

# Upload generated files back to Google Drive
upload:
  enabled: false
  # folder_id: ""  # Google Drive folder ID to upload features.yaml to
  # features_file_id: ""  # Existing file ID to update (skip if creating new)
