description = "Implement feature following plan"
prompt = """
Implement a feature following its plan.

Read `skills/implement-feature/SKILL.md` for the full procedure.

Arguments: {{args}} (optional feature ID — shows selectable list if omitted)

If no argument:
1. Run: `node adapters/generic/agent-workflow.mjs list-features READY`
2. Also show IN_PROGRESS features
3. Ask user to select

If argument provided:
1. Resolve feature: `node adapters/generic/agent-workflow.mjs find-feature {{args}}`
2. Run preflight: `node scripts/preflight/preflight.mjs <resolved-id>`
3. If preflight fails, report blockers and STOP — do not implement
4. Read implementation plan from `docs/features/<id>/implementation-plan.md`
5. Follow the plan's implementation order
6. Write tests alongside code
7. Update feature status to IN_PROGRESS, then IMPLEMENTED when done
8. Update registry entries

CRITICAL: Never implement with stale design. Never implement unrelated features.
"""
